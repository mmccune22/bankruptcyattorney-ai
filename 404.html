<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Matt McCune</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --text: #0f2419; --soft: #33463c; --accent: #1f6b47; --line: #e4ebe6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e1411; --text: #e6eee9; --soft: #c2cec7; --accent: #6cc196; --line: #223029; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 18px/1.65 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 640px; margin: min(15vh, 120px) auto; }
    .brand { margin: 0 0 40px; padding-bottom: 20px; border-bottom: 1px solid var(--line); font-weight: 600; }
    .code { margin: 0 0 8px; color: var(--soft); font-size: 15px; }
    h1 { margin: 0 0 20px; font-size: clamp(32px, 6vw, 48px); line-height: 1.15; letter-spacing: -.02em; }
    p { margin: 0 0 24px; color: var(--soft); }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Matt McCune · BankruptcyAttorney.ai</p>
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p>This page may have moved, or the address may be incorrect.</p>
    <a href="/">Back to Matt’s homepage</a>
  </main>
</body>
</html>
